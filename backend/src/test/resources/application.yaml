spring:
  datasource:
    url: jdbc:h2:mem:drafts-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

security:
  jwt:
    secret: ZHVtbXktaG1hYy1rZXktZm9yLXRlc3RzLTAxMjM0NTY3ODkwYWJjZGVm

app:
  frontend-urls: http://localhost:3000
  cloudinary:
    cloud-name: drafts-test
    api-key: drafts-test-key
    api-secret: drafts-test-secret
    upload-preset: drafts-test-preset
