spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/drafts}
    username: ${DB_USERNAME:drafts}
    password: ${DB_PASSWORD:drafts}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET}

app:
  frontend-urls: ${FRONTEND_URLS:http://localhost:3000}
  auth:
    secure-cookies: ${SECURE_COOKIES:true}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET}
